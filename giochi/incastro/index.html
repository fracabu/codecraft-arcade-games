<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Incastro 8x8 — arcade.nerd</title>
<meta name="description" content="Puzzle a blocchi: trascina i pezzi sulla griglia 8x8, riempi righe e colonne, fai combo. Gratis per PC e telefono.">
<meta name="theme-color" content="#0a0f0b">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icone/icona.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../comune/gioco.css">
<style>
  html, body { margin: 0; height: 100%; background: #0a0f0b; overflow: hidden; overscroll-behavior: none; }
  body {
    display: grid; grid-template-rows: auto 1fr auto;
    font: 14px/1.4 ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; color: #b9f5c1;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  header {
    display: flex; justify-content: flex-end; align-items: baseline; gap: 14px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px 150px;
    min-height: 50px;
  }
  #punti { font-size: 24px; color: #39ff88; letter-spacing: .05em; }
  #record { color: #6c9675; font-size: 12px; }
  #combo { color: #ff4fb3; font-size: 13px; min-width: 6ch; }
  #tela { width: 100%; height: 100%; display: block; touch-action: none; }
  footer { color: #5d8466; font-size: 12px; text-align: center; padding: 4px 12px max(10px, env(safe-area-inset-bottom)); }
  @media (pointer: coarse) { footer .tastiera { display: none; } }
</style>
</head>
<body>
<a class="torna" href="../../">&larr; sala giochi</a>
<header><span id="combo" aria-live="polite"></span><span id="record"></span><span id="punti" aria-label="punti">00000</span></header>
<canvas id="tela" aria-label="Griglia di gioco 8 per 8 e vassoio con tre pezzi"></canvas>
<footer>trascina i pezzi sulla griglia · righe e colonne piene si svuotano<span class="tastiera"> · tastiera: 1 2 3 scegli, frecce sposta, Invio posa</span></footer>
<script type="module" src="gioco.js"></script>
</body>
</html>
